<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Interest — Neon Glass Calculator</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="card">
        <div class="brand">
          <svg viewBox="0 0 300 28" class="logo" aria-hidden="true" preserveAspectRatio="xMinYMid meet">
            <defs>
              <linearGradient id="g" x1="0" x2="1">
                <stop offset="0%" stop-color="#7ee8fa" />
                <stop offset="100%" stop-color="#8e54e9" />
              </linearGradient>
            </defs>
            <text x="0" y="18" fill="url(#g)" font-weight="800" font-size="16">Neon</text>
            <text x="70" y="18" fill="#fff" font-weight="700" font-size="16">Simple Interest</text>
          </svg>
        </div>

        <form id="calc" class="form" onsubmit="return false;">
          <div class="row">
            <label>Principal</label>
            <div class="controls">
              <input type="range" id="pRange" min="100" max="100000" step="100" value="1000" />
              <input type="number" id="principal" min="0" value="1000" />
            </div>
          </div>

          <div class="row">
            <label>Rate (% per year)</label>
            <div class="controls">
              <input type="range" id="rRange" min="0.1" max="25" step="0.1" value="5" />
              <input type="number" id="rate" min="0" step="0.1" value="5" />
            </div>
          </div>

          <div class="row">
            <label>Time (years)</label>
            <div class="controls">
              <input type="range" id="tRange" min="0.5" max="30" step="0.5" value="1" />
              <input type="number" id="time" min="0" step="0.5" value="1" />
            </div>
          </div>

          <div class="actions">
            <button id="calculate" class="btn">Calculate</button>
            <button id="reset" class="btn ghost" type="button">Reset</button>
          </div>
          <div class="mini-actions" style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end">
            <button id="copyBtn" class="btn ghost" type="button">Copy Result</button>
            <button id="exportBtn" class="btn ghost" type="button">Export CSV</button>
          </div>
          <p id="err" style="color:#ffb4b4;margin-top:8px;display:none"></p>
        </form>

        <section class="result" aria-live="polite">
          <div class="result-inner">
            <h3>Result</h3>
            <p class="line">Interest: <span id="interest">—</span></p>
            <p class="line">Total Amount: <span id="total">—</span></p>
            <div class="breakdown">
              <h4 style="margin:10px 0 6px 0">Annual Breakdown</h4>
              <ul id="breakdown" style="margin:0;padding-left:18px;"> </ul>
            </div>
          </div>
        </section>

        <footer class="credits">Made with ✨ — see README for details</footer>
      </section>
    </main>

    <script src="/static/script.js"></script>
    <div class="site-author">DONE BY KATHIR</div>
  </body>
</html>
